# =============================================================================
# config-repo/application.yml
# Base configuration served to ALL microservices by the Config Server.
# Values here are OVERRIDDEN by Docker environment variables at runtime.
# =============================================================================

# Actuator - expose health and info endpoints (used by Docker healthchecks)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Eureka client config (all services register here)
eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    registry-fetch-interval-seconds: 10

# RabbitMQ
spring:
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

  # Redis
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms

  # JPA defaults (each service overrides datasource URL)
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

# Logging
logging:
  level:
    com.ecommerce: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

# SpringDoc / Swagger UI
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    display-request-duration: true

# Application security JWT defaults
application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000
